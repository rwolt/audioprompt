[logger]
# Verbosity for Streamlit internals and your print/log output
level = "info"
messageFormat = "%(asctime)s %(levelname)s %(message)s"

[client]
# Show full tracebacks in the browser to aid debugging
showErrorDetails = "minimal"
toolbarMode = "developer"

[runner]
# Keep reruns responsive during rapid UI changes
fastReruns = true

[server]
# Default headless on cloud; harmless locally
headless = true

